name: Java CI

on:
  push:
    branches:
      - main
      - final
  pull_request:
    branches:
      - main
      - final

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test server
        working-directory: QuizzServer
        run: mvn --batch-mode test

      - name: Test client
        working-directory: QuizzClient
        run: mvn --batch-mode test
